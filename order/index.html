<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your order | Noctra</title><meta name="description" content="Order status."><meta name="theme-color" content="#0f0819">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css"><meta name="robots" content="noindex"></head><body><div id="hdr"></div><main id="main">
<section class="pg"><div id="o" class="prose"><p>Checking your order...</p></div></section></main><div id="ftr"></div><script type="module">
import {chrome, api, money, esc, setCart, orderView, $} from "/assets/app.js"; chrome();
const ref = new URLSearchParams(location.search).get("ref"), qt = new URLSearchParams(location.search).get("t");
const token = qt || (JSON.parse(localStorage.noctra_orders || "{}"))[ref];
async function load(n = 0) {
  if (!ref || !token) { location.replace("/track/" + (ref ? "?ref=" + encodeURIComponent(ref) : "")); return; }
  let d; try { d = await api("status", { publicRef: ref, token }); } catch { location.replace("/track/?ref=" + encodeURIComponent(ref)); return; }
  const paid = d.paymentStatus === "paid";
  if (paid) setCart([]);
  const status = paid ? "" : d.paymentStatus === "failed" ? '<p class="err">Payment failed. You can try again from your bag.</p>' : '<p class="ok">Confirming your payment...</p>';
  $("#o").innerHTML = `${paid ? "<h1 style=\"font-size:2.6rem\">Thank you.</h1><p>A confirmation is on its way to your email.</p>" : ""}${status}${orderView({ ...d, discountMinor: 0 })}
  <p style="margin-top:28px"><a class="btn ghost" href="/account/">Sign in to see all your orders</a></p>`;
  if (!paid && d.paymentStatus !== "failed" && n < 30) setTimeout(() => load(n + 1), 4000);
}
load();
</script></body></html>
