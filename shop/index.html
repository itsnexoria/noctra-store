<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop | Noctra</title><meta name="description" content="Browse the full Noctra collection."><meta name="theme-color" content="#0f0819">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css"></head><body><div id="hdr"></div><main id="main">
<section class="sec"><div class="hd"><h2>Shop</h2></div><div class="chips" id="chips"></div><div class="grid" id="grid"></div></section></main><div id="ftr"></div><script type="module">
import {chrome} from "/assets/app.js"; chrome();

import {rest,card,LIST,emptyShelf,esc,$} from "/assets/app.js";
let all = [], tag = "";
const draw = () => { const l = tag ? all.filter(p => (p.tags||[]).includes(tag)) : all; $("#grid").innerHTML = l.length ? l.map(card).join("") : emptyShelf(); };
try {
  all = await rest(LIST + "&limit=100");
  const tags = [...new Set(all.flatMap(p => p.tags || []))].slice(0, 12);
  if (tags.length) { $("#chips").innerHTML = ["", ...tags].map(t => `<button class="chip${t ? "" : " on"}" data-t="${esc(t)}">${t ? esc(t) : "All"}</button>`).join("");
    $("#chips").onclick = e => { const b = e.target.closest(".chip"); if (!b) return; tag = b.dataset.t; document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === b)); draw(); }; }
} catch {}
draw();

</script></body></html>
