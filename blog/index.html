<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Journal | Noctra</title><meta name="description" content="Stories, drops and notes from Noctra."><meta name="theme-color" content="#0b0614">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css"></head><body><div id="hdr"></div><main id="main"><section class="pg"><h1 style="font-size:clamp(2.6rem,6vw,4.6rem)">The journal</h1><p class="note" style="margin-bottom:40px">Stories, drops and notes from Noctra.</p><div class="bgrid" id="b"></div></section></main><div id="ftr"></div><script type="module">
import {chrome} from "/assets/app.js"; chrome();

import {rest,esc,star,$} from "/assets/app.js";
try { const b = await rest("posts?select=slug,title,excerpt,cover_url,published_at&published=eq.true&order=published_at.desc&limit=60");
  $("#b").innerHTML = b.length ? b.map(p => `<a class="bcard" href="/blog/post/?s=${encodeURIComponent(p.slug)}"><div class="ph">${p.cover_url ? `<img src="${esc(p.cover_url)}" alt="" loading="lazy">` : star}</div><p class="note" style="margin-top:12px">${new Date(p.published_at).toLocaleDateString("en-ZA",{day:"numeric",month:"long",year:"numeric"})}</p><h3 style="margin-top:2px">${esc(p.title)}</h3><p>${esc(p.excerpt)}</p></a>`).join("") : '<p class="note">The first story is coming soon.</p>'; }
catch { $("#b").innerHTML = '<p class="note">Could not load posts. Please refresh.</p>'; }

</script></body></html>
