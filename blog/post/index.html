<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Journal | Noctra</title><meta name="description" content="A post from the Noctra journal."><meta name="theme-color" content="#0b0614">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css"></head><body><div id="hdr"></div><main id="main"><section class="pg"><article class="post" id="p"><p class="note">Loading...</p></article></section></main><div id="ftr"></div><script type="module">
import {chrome} from "/assets/app.js"; chrome();

import {rest,md,esc,$} from "/assets/app.js";
const s = new URLSearchParams(location.search).get("s") || "";
let p = null; try { [p] = await rest(`posts?slug=eq.${encodeURIComponent(s)}&published=eq.true&select=*`); } catch {}
if (!p) $("#p").innerHTML = '<h1>Post not found</h1><p><a class="btn" href="/blog/">Back to the journal</a></p>';
else { document.title = p.title + " | Noctra"; document.querySelector('meta[name=description]').content = p.excerpt;
  $("#p").innerHTML = `<p class="note">${new Date(p.published_at).toLocaleDateString("en-ZA",{day:"numeric",month:"long",year:"numeric"})}</p><h1>${esc(p.title)}</h1>${p.cover_url ? `<img class="cover" src="${esc(p.cover_url)}" alt="">` : ""}${md(p.body)}<p style="margin-top:40px"><a class="btn ghost" href="/blog/">More from the journal</a></p>`; }

</script></body></html>
